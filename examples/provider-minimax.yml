# MiniMax through the OpenAI-compatible in-process runner (`provider: openai`, v2.4.0+).
#
# The action owns the review loop in-process — zero CLI install, bounded
# turns, predictable cost — pointed at MiniMax through `api-base`
# (`balanced` -> `MiniMax-M2`, `economy` -> `MiniMax-Text-01`).
#
# MiniMax also speaks the Anthropic-compatible protocol — for the
# `claude-code` runner use instead:
#   provider: claude-code
#   api-base: https://api.minimax.io/anthropic
#   model: MiniMax-M2
# SECURITY: `api-key` is sent to the `api-base` host.

name: PR review (MiniMax)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required: the runtime diffs origin/<base>...HEAD
          persist-credentials: false   # never leave GITHUB_TOKEN in .git/config

      - uses: DailybotHQ/ai-diff-reviewer@v3
        with:
          provider: openai
          api-base: https://api.minimax.io/v1
          api-key: ${{ secrets.MINIMAX_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          model: balanced   # MiniMax-M2 (balanced/deep); MiniMax-Text-01 (economy)
