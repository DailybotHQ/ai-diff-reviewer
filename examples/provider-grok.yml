# xAI Grok CLI provider (agent-runner family, v2.1.0+).
#
# The action installs the official Grok CLI (only for this provider) and runs
# it headless with the SAME review contract as every other runner: your
# rubric + the findings schema go in via `--rules`, the PR diff via a private
# `--prompt-file`, the agent writes `.aiprr/findings.json`, and the runtime
# applies severity gating, Iteration-Aware Review dedup, collapse-previous,
# the inline cap and the tracking comment.
#
# How this differs from xAI's suggested bare workflow
# (`grok -p "Review this PR" --always-approve` with GH_TOKEN in the env):
#   - the agent NEVER receives your GitHub token — the runtime posts the review;
#   - web search and subagents are OFF by default (exfiltration + cost);
#   - `agent-max-turns` becomes a native `--max-turns` cap;
#   - findings are structured, gated and de-duplicated across rounds.
#
# Auth: XAI_API_KEY (https://console.x.ai/), billed as xAI API credits.
# Default model `grok-4.3`; pin `grok-4.6` for a deeper reasoning pass.
# `api-base` is ignored for this provider (the CLI talks to xAI only).
# SECURITY: agent-runner CLIs run with broad local access — trusted
# (non-fork) PRs only; keep `persist-credentials: false`.

name: PR review (xAI Grok)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: DailybotHQ/ai-diff-reviewer@v2
        with:
          provider: grok
          api-key: ${{ secrets.XAI_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # model: grok-4.6              # deeper reasoning pass
          # agent-max-turns: '12'        # native --max-turns cap
          # grok-version: '1.0.30'       # optional CLI pin
          # agent-extra-args: '--reasoning-effort high'   # any vendor flag; re-enable web search with '--allow web_search' at your own risk
          # Optional supply-chain pin: sha256 of the artefact the grok install
          # step downloads (logged on every run). A mismatch fails the step.
          # grok-installer-sha256: <64-hex>
