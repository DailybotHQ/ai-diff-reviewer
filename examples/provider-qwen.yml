# Qwen (Alibaba DashScope compatible-mode) through the OpenAI-compatible in-process runner (`provider: openai`, v2.4.0+).
#
# The action owns the review loop in-process — zero CLI install, bounded
# turns, predictable cost — pointed at Qwen through `api-base`
# (`balanced` -> `qwen3-coder-plus`, `economy` -> `qwen-turbo`).
# SECURITY: `api-key` is sent to the `api-base` host.

name: PR review (Qwen)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required: the runtime diffs origin/<base>...HEAD

      - uses: DailybotHQ/ai-diff-reviewer@v2
        with:
          provider: openai
          api-base: https://dashscope.aliyuncs.com/compatible-mode/v1
          api-key: ${{ secrets.DASHSCOPE_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          model: balanced   # qwen3-coder-plus (balanced/deep); qwen-turbo (economy)
