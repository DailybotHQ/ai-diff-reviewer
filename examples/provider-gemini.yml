# Google Gemini through its OpenAI-compatible endpoint (`provider: openai`, v2.4.0+).
#
# The action owns the review loop in-process — zero CLI install, bounded
# turns, predictable cost — pointed at Google Gemini through `api-base`
# (`balanced`/`deep` -> `gemini-2.5-pro`, `economy` -> `gemini-2.5-flash`).
# The runtime omits `seed` for this endpoint (it rejects the parameter
# with a 400) and pins `temperature: 0`.
# SECURITY: `api-key` is sent to the `api-base` host.

name: PR review (Gemini)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required: the runtime diffs origin/<base>...HEAD

      - uses: DailybotHQ/ai-diff-reviewer@v2
        with:
          provider: openai
          api-base: https://generativelanguage.googleapis.com/v1beta/openai
          api-key: ${{ secrets.GEMINI_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          model: balanced   # gemini-2.5-pro (balanced/deep); gemini-2.5-flash (economy)
