# DeepSeek through the OpenAI-compatible in-process runner (`provider: openai`, v2.4.0+).
#
# The action owns the review loop in-process — zero CLI install, bounded
# turns, predictable cost — pointed at DeepSeek through `api-base`
# (`balanced` -> `deepseek-chat`, `deep` -> `deepseek-reasoner`).
# Tier aliases (`balanced` / `economy` / `deep`) resolve from the dated
# matrix in docs/PROVIDERS.md.
# SECURITY: `api-key` is sent to the `api-base` host.

name: PR review (DeepSeek)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required: the runtime diffs origin/<base>...HEAD

      - uses: DailybotHQ/ai-diff-reviewer@v2
        with:
          provider: openai
          api-base: https://api.deepseek.com
          api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          model: balanced   # deepseek-chat (balanced/economy); deepseek-reasoner (deep)
